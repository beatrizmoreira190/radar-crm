name: Security and build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/security-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || '' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and generate lockfile
        run: npm install --no-fund

      - name: Commit lockfile on hardening branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/security-hardening'
        run: |
          if ! git diff --quiet -- package-lock.json || [ ! -f package-lock.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "security: lock dependency tree"
            git push
          fi

      - name: Fail on high/critical dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
