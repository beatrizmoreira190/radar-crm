name: Security, build and smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use current npm audit client
        run: npm install --global npm@11.19.1

      - name: Install locked dependencies
        run: npm ci --no-fund

      - name: Fail on high/critical dependency vulnerabilities
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            echo "Security audit attempt $attempt/5"
            output="$(npm audit --audit-level=high --json 2>&1)"
            code=$?
            echo "$output"
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if printf '%s' "$output" | grep -q '"auditReportVersion"'; then
              exit "$code"
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 10
            fi
          done
          exit "$code"

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npm run start > /tmp/radar-next.log 2>&1 &
          echo $! > /tmp/radar-next.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/radar-health.json; then
              cat /tmp/radar-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/radar-next.log
          exit 1

      - name: Smoke test public routes
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/login > /dev/null

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/radar-next.pid ]; then
            kill "$(cat /tmp/radar-next.pid)" || true
          fi
