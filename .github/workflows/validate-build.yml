name: Security and build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/security-hardening]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-fund

      - name: Fail on high/critical dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
